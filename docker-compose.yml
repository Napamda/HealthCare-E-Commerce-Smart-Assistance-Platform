# =====================================================
# Healthcare Platform — one-command dev environment
# Usage:  docker compose up -d
# Services:
#   mysql       : localhost:3306
#   rabbitmq    : localhost:5672  | management UI: http://localhost:15672
#   mailhog     : localhost:1025 (SMTP) | web UI: http://localhost:8025
# =====================================================
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: healthcare
      MYSQL_USER: ${DB_USER:-healthcare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-healthcare}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-healthcare}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  mysql-data:
  rabbitmq-data:
