spring:
  application:
    name: HealthCare-Platform
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/healthcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: caffeine
    cache-names:
      - products
      - geocode
      - reverseGeocode
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=24h
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

# =====================================================
# AI Configuration — OpenRouter via custom provider
# =====================================================
ai:
  # Active provider: openrouter | mock
  provider: ${AI_PROVIDER:mock}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: https://openrouter.ai/api/v1
    model: ${OPENROUTER_MODEL:openrouter/free}
    timeout-seconds: 60
  memory:
    max-history: 10
    summary-threshold: 30
  ocr:
    enabled: ${AI_OCR_ENABLED:true}
    model: ${AI_OCR_MODEL:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}

# =====================================================
# JWT Configuration
# =====================================================
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_A_LONG_RANDOM_STRING_AT_LEAST_256_BITS}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 86400000
  remember-me-expiration-ms: 2592000000

  # Context memory — controls how many messages are sent as prompt context
  memory:
    max-history: 10
    summary-threshold: 30
    
# =====================================================
# Geocoding Configuration — Nominatim (OpenStreetMap)
# =====================================================
geocoding:
  base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
  user-agent: ${GEOCODING_USER_AGENT:HealthCarePlatform/1.0 (https://localhost)}

# =====================================================
# Storage Configuration
# =====================================================
user:
  avatar:
    storage-root: ${AVATAR_STORAGE_ROOT:/data/avatars}
prescription:
  storage-root: ${PRESCRIPTION_STORAGE_ROOT:/data/prescriptions}

mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    name: ${LOG_PATH:/data/logs}/application.log
