<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: #16a34a; padding: 20px; border-radius: 8px 8px 0 0; text-align: center;">
    <h1 style="color: white; margin: 0;">Order Confirmed</h1>
  </div>
  <div style="background: #f8fafc; padding: 30px; border-radius: 0 0 8px 8px; border: 1px solid #e2e8f0;">
    <h2>Hi <span th:text="${name}">Customer</span>,</h2>
    <p>Your order has been confirmed. Here are the details:</p>
    <table style="width: 100%; border-collapse: collapse; margin: 15px 0;">
      <tr style="background: #e2e8f0;">
        <th style="padding: 10px; text-align: left;">Order ID</th>
        <td style="padding: 10px;" th:text="${orderId}">#</td>
      </tr>
      <tr>
        <th style="padding: 10px; text-align: left;">Total Amount</th>
        <td style="padding: 10px;" th:text="${total}">$0.00</td>
      </tr>
    </table>
    <h3>Items:</h3>
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background: #e2e8f0;">
          <th style="padding: 8px; text-align: left;">Product</th>
          <th style="padding: 8px;">Qty</th>
          <th style="padding: 8px;">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${items}">
          <td style="padding: 8px;" th:text="${item.productName}">Product</td>
          <td style="padding: 8px; text-align: center;" th:text="${item.quantity}">1</td>
          <td style="padding: 8px;" th:text="${item.price}">$0.00</td>
        </tr>
      </tbody>
    </table>
    <p style="margin-top: 20px;">We'll notify you when your order ships. Thank you for choosing HealthCare Platform!</p>
  </div>
</body>
</html>
