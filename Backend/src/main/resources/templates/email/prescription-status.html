<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background: #7c3aed; padding: 20px; border-radius: 8px 8px 0 0; text-align: center;">
    <h1 style="color: white; margin: 0;">Prescription Update</h1>
  </div>
  <div style="background: #f8fafc; padding: 30px; border-radius: 0 0 8px 8px; border: 1px solid #e2e8f0;">
    <h2>Hi <span th:text="${name}">User</span>,</h2>
    <p>Your prescription has been <strong th:text="${status}">reviewed</strong>.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 15px 0;">
      <tr style="background: #e2e8f0;">
        <th style="padding: 10px; text-align: left;">Prescription ID</th>
        <td style="padding: 10px;" th:text="${prescriptionId}">#</td>
      </tr>
      <tr>
        <th style="padding: 10px; text-align: left;">Status</th>
        <td style="padding: 10px; text-transform: capitalize;" th:text="${status}">Pending</td>
      </tr>
      <tr th:if="${comments}">
        <th style="padding: 10px; text-align: left;">Pharmacist Comments</th>
        <td style="padding: 10px;" th:text="${comments}">N/A</td>
      </tr>
    </table>
    <a th:href="${prescriptionUrl}" style="display: inline-block; padding: 12px 24px; background: #7c3aed; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px;">View Prescription</a>
    <p style="margin-top: 20px; color: #64748b; font-size: 12px;">If you have questions, please contact your pharmacist.</p>
  </div>
</body>
</html>
